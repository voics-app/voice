[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/interface", "bin/prober"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"

[package]
name = "voice-prober"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[dependencies]
probe-domain.workspace = true
probe-application.workspace = true
probe-infrastructure.workspace = true
probe-interface.workspace = true

[dev-dependencies]
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[workspace.dependencies]
probe-domain = { path = "crates/domain" }
probe-application = { path = "crates/application" }
probe-infrastructure = { path = "crates/infrastructure" }
probe-interface = { path = "crates/interface" }
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
