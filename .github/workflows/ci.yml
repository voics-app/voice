name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  signaling:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/elixir.yml@main
    with:
      working-directory: signaling
      image-name: voice-signaling
      description: Voics voice signaling
      sobelow: false

  sfu:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      working-directory: sfu
      image-name: voice-sfu
      description: Voics SFU
      system-packages: cmake

  regionctl:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      working-directory: regionctl
      image-name: regionctl
      description: Voics region control CLI

  prober:
    permissions:
      contents: read
      actions: read
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      working-directory: prober
      image-name: voice-prober
      description: Voics independent media health observer
      system-packages: cmake

  docker:
    needs: [signaling, sfu, prober]
    strategy:
      matrix:
        component: [signaling, sfu, prober]
    permissions: {contents: read, packages: write, id-token: write}
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: voice-${{ matrix.component }}
      description: Voics voice ${{ matrix.component }}
      context: ${{ matrix.component }}
      dockerfile: ${{ matrix.component }}/Dockerfile
