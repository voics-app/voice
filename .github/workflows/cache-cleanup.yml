# Weekly GitHub Actions cache hygiene (voics-app/gitops#38): drops caches unused for 7 days and keeps the
# repository well below the 10 GB cache limit.
name: cache-cleanup

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report what would be deleted."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      actions: write
      contents: read
    uses: voics-app/.github/.github/workflows/cache-cleanup.yml@main
    with:
      dry-run: ${{ inputs.dry-run || false }}
